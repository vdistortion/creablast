<nav class="navigation" aria-label="Main navigation">
  <ul id="navigation-menu" class="navigation__menu" [class.open-mobile-menu]="mobileMenu()">
    <li>
      <a
        routerLink=""
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >{{ pageNameMain }}</a
      >
    </li>
    <li>
      <a
        routerLink="/work"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >{{ pageNameWork }}</a
      >
    </li>
    <li>
      <a
        routerLink="/about"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >{{ pageNameAbout }}</a
      >
    </li>
  </ul>
  <button
    #toggleButton
    class="navigation__button"
    type="button"
    aria-controls="navigation-menu"
    [attr.aria-expanded]="mobileMenu()"
    [attr.aria-label]="mobileMenu() ? 'Close navigation' : 'Open navigation'"
    (click)="toggleMenu()"
  >
    <svg-nav-btn [open]="mobileMenu()"></svg-nav-btn>
  </button>
</nav>
