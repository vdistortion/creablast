<div class="card">
  <a [routerLink]="['/work', project().id]">
    <img
      [src]="'/images/projects/' + project().image.src"
      [attr.srcset]="project().image.srcset"
      sizes="(max-width: 500px) calc(100vw - 40px), (max-width: 800px) calc((100vw - 60px) / 2), (max-width: 1040px) calc((100vw - 80px) / 3), 320px"
      [width]="project().image.width"
      [height]="project().image.height"
      [alt]="project().title"
      loading="lazy"
      decoding="async"
    />
  </a>
  <div class="card__description">{{ project().description }}</div>
  <a [routerLink]="['/work', project().id]">{{ project().title }}</a>
</div>
