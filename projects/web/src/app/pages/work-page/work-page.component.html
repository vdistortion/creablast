<main class="projects">
  <div class="projects__title">
    <span> Selection of <span class="second-font">exciting</span> projects. </span>
  </div>
  <div class="projects__container">
    @for (project of projects; track project.id) {
      <app-project-card class="projects__item" [project]="project"></app-project-card>
    }
  </div>
</main>
